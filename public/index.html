<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALI MODS | Acesso Seguro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0b0b0e;
            --bg-card: rgba(18, 18, 24, 0.85);
            --border: rgba(255, 255, 255, 0.07);
            --text: #f0f0f0;
            --text-muted: #8a8a9a;
            --primary: #ffffff;
            --primary-glow: rgba(255, 255, 255, 0.08);
            --success: #22c55e;
            --danger: #ef4444;
            --radius: 12px;
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .noise::before {
            content: ''; position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.025; pointer-events: none; z-index: 0;
        }
        .grid-bg {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }
        .orb {
            position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 0;
        }
        .orb-1 { width: 500px; height: 500px; background: rgba(255,255,255,0.04); top: -10%; left: -10%; }
        .orb-2 { width: 400px; height: 400px; background: rgba(255,255,255,0.03); bottom: -15%; right: -10%; }
        .notifications-container {
            position: fixed; top: 20px; right: 20px; width: 360px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px;
        }
        .notification {
            background: rgba(16, 16, 22, 0.95);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 10px; padding: 14px 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            transform: translateX(420px) scale(0.95);
            opacity: 0;
            transition: all 0.4s var(--ease);
            display: flex; align-items: flex-start; gap: 12px;
        }
        .notification.show { transform: translateX(0) scale(1); opacity: 1; }
        .notification.hide { transform: translateX(420px) scale(0.95); opacity: 0; }
        .notification.success { border-left: 3px solid var(--success); }
        .notification.danger { border-left: 3px solid var(--danger); }
        .notification.info { border-left: 3px solid #6366f1; }
        .notification-icon { font-size: 16px; margin-top: 2px; flex-shrink: 0; }
        .notification.success .notification-icon { color: var(--success); }
        .notification.danger .notification-icon { color: var(--danger); }
        .notification.info .notification-icon { color: #6366f1; }
        .notification-content { flex: 1; min-width: 0; }
        .notification-title { font-weight: 600; font-size: 14px; margin-bottom: 3px; color: #fff; }
        .notification-message { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
        .notification-close {
            background: rgba(255,255,255,0.04); border: none; color: var(--text-muted);
            cursor: pointer; font-size: 11px; padding: 4px; border-radius: 6px;
            flex-shrink: 0; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .notification-close:hover { color: #fff; background: rgba(255,255,255,0.1); }
        .login-card {
            position: relative; z-index: 1;
            background: var(--bg-card);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            padding: 44px 40px;
            border-radius: 20px;
            width: 100%; max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 60px -12px rgba(0,0,0,0.6);
            text-align: center;
            animation: cardIn 0.7s var(--ease);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(25px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .brand-icon {
            width: 56px; height: 56px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px;
            font-size: 22px; color: #fff;
        }
        .brand-text {
            font-size: 26px; font-weight: 700; color: #fff;
            margin-bottom: 6px; letter-spacing: -0.5px;
        }
        .brand-sub {
            font-size: 13px; color: var(--text-muted);
            margin-bottom: 32px;
        }
        .tabs-wrap {
            background: rgba(0,0,0,0.3);
            padding: 3px;
            border-radius: 10px;
            display: flex;
            margin-bottom: 28px;
            border: 1px solid var(--border);
        }
        .tab {
            flex: 1; padding: 10px; cursor: pointer; border-radius: 8px;
            font-weight: 500; font-size: 13px;
            transition: all 0.3s var(--ease);
            color: var(--text-muted);
            display: flex; justify-content: center; align-items: center; gap: 6px;
        }
        .tab.active {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .tab:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.03); }
        .input-group {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
            transition: 0.3s;
            pointer-events: none;
        }
        input {
            width: 100%;
            padding: 14px 14px 14px 42px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s var(--ease);
        }
        input:focus {
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.6);
        }
        input::placeholder { color: #555; }
        input:focus + i { color: #fff; }
        button {
            width: 100%;
            padding: 14px;
            background: #fff;
            border: none;
            border-radius: 10px;
            color: #0b0b0e;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s var(--ease);
            font-size: 14px;
            letter-spacing: 0.3px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -5px rgba(255,255,255,0.15);
        }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        #msg {
            margin-top: 20px;
            padding: 12px 14px;
            border-radius: 8px;
            display: none;
            font-size: 13px;
            align-items: center; justify-content: center; gap: 8px;
            transition: 0.3s;
        }
        #msg.error {
            background: rgba(239, 68, 68, 0.08);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.12);
            display: flex;
        }
        .footer-text {
            margin-top: 28px;
            font-size: 10px;
            color: rgba(255,255,255,0.12);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        @media (max-width: 480px) {
            .login-card { max-width: 92%; padding: 32px 24px; }
            .notifications-container { width: calc(100% - 32px); right: 16px; top: 12px; }
        }
    </style>
</head>
<body class="noise">
    <div class="grid-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="notifications-container" id="notifications-container"></div>

    <div class="login-card">
        <div class="brand-icon">
            <i class="fas fa-key"></i>
        </div>
        <div class="brand-text">KALI MODS</div>
        <div class="brand-sub">Sistema de Autenticação</div>

        <div class="tabs-wrap">
            <div class="tab active" onclick="sw('client')">
                <i class="fas fa-gamepad"></i> CLIENTE
            </div>
            <div class="tab" onclick="sw('admin')">
                <i class="fas fa-shield-halved"></i> ADMIN
            </div>
        </div>

        <div id="client-form">
            <div class="input-group">
                <label>Licença</label>
                <div class="input-wrap">
                    <input type="text" id="key" placeholder="HK-XXXX" autocomplete="off">
                    <i class="fas fa-key"></i>
                </div>
            </div>
            <button onclick="authDiscord()">
                Acessar Sistema <i class="fas fa-arrow-right" style="margin-left:6px;font-size:12px"></i>
            </button>
        </div>

        <div id="admin-form" style="display:none">
            <div class="input-group">
                <label>Usuário</label>
                <div class="input-wrap">
                    <input type="text" id="user" placeholder="Nome de usuário" autocomplete="off">
                    <i class="fas fa-user"></i>
                </div>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <div class="input-wrap">
                    <input type="password" id="pass" placeholder="••••••••">
                    <i class="fas fa-lock"></i>
                </div>
            </div>
            <div class="input-group" id="phone-group" style="display:none;">
                <label>Telefone (Verificação)</label>
                <div class="input-wrap">
                    <input type="tel" id="phone" placeholder="DDD + Número">
                    <i class="fas fa-phone"></i>
                </div>
            </div>
            <button onclick="auth('admin')">
                Painel Administrativo <i class="fas fa-arrow-right" style="margin-left:6px;font-size:12px"></i>
            </button>
        </div>

        <div id="msg"></div>
        <div class="footer-text">KALI MODS Security System v2.0</div>
    </div>

    <script>
        const notificationSystem = {
            container: document.getElementById('notifications-container'),
            n: 0,
            show(type, title, message, duration = 4000) {
                this.n++;
                const id = 'n-' + this.n;
                const el = document.createElement('div');
                el.id = id;
                el.className = 'notification ' + type;
                const icon = type === 'success' ? 'fa-check-circle' : type === 'danger' ? 'fa-times-circle' : 'fa-info-circle';
                el.innerHTML = `
                    <i class="fas ${icon} notification-icon"></i>
                    <div class="notification-content">
                        <div class="notification-title">${title}</div>
                        <div class="notification-message">${message}</div>
                    </div>
                    <button class="notification-close"><i class="fas fa-times"></i></button>
                `;
                this.container.appendChild(el);
                el.querySelector('.notification-close').addEventListener('click', () => this.close(id));
                setTimeout(() => el.classList.add('show'), 10);
                if (duration > 0) setTimeout(() => this.close(id), duration);
                return id;
            },
            close(id) {
                const el = document.getElementById(id);
                if (!el) return;
                el.classList.remove('show'); el.classList.add('hide');
                setTimeout(() => el.remove(), 400);
            },
            success(t, m, d) { return this.show('success', t, m, d); },
            error(t, m, d) { return this.show('danger', t, m, d); },
            info(t, m, d) { return this.show('info', t, m, d); }
        };

        window.addEventListener('load', () => {
            setTimeout(() => notificationSystem.info('KALI MODS', 'Bem-vindo ao portal de acesso seguro'), 1000);
            const params = new URLSearchParams(window.location.search);
            const err = params.get('error');
            if (err === 'session_expired') {
                notificationSystem.error('Sessão expirada', 'Tente novamente digitando sua key.');
            } else if (err === 'already_linked') {
                notificationSystem.error('Conta já vinculada', 'Este Discord já está vinculado a outra key.');
            } else if (err === 'auth_failed' || err === 'no_code') {
                notificationSystem.error('Autenticação falhou', 'Não foi possível autenticar com o Discord.');
            } else if (err === 'server_error') {
                notificationSystem.error('Erro no servidor', 'Ocorreu um erro interno. Tente novamente.');
            }
        });

        function sw(t) {
            adminStep = 'credentials';
            document.getElementById('phone-group').style.display = 'none';
            document.getElementById('client-form').style.display = t === 'client' ? 'block' : 'none';
            document.getElementById('admin-form').style.display = t === 'admin' ? 'block' : 'none';
            document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById('msg').className = 'msg';
            document.getElementById('msg').style.display = 'none';
        }

        let adminStep = 'credentials';

        async function authDiscord() {
            const key = document.getElementById('key').value.trim();
            if (!key) {
                notificationSystem.error('Key necessária', 'Digite sua licença para continuar');
                return;
            }

            const btn = event.currentTarget;
            const orig = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Autenticando...';
            btn.disabled = true;

            try {
                const res = await fetch('/auth/discord/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key })
                });
                const d = await res.json();

                if (d.success && d.redirect) {
                    location.href = d.redirect;
                } else {
                    notificationSystem.error('Falha na Autenticação', d.error || 'Erro ao autenticar');
                    btn.innerHTML = orig;
                    btn.disabled = false;
                }
            } catch (e) {
                notificationSystem.error('Erro de Conexão', 'Não foi possível conectar ao servidor.');
                btn.innerHTML = orig;
                btn.disabled = false;
            }
        }

        async function auth(type) {
            const btn = event.target.closest('button');
            const orig = btn.innerHTML;

            if (type === 'admin' && adminStep === 'phone') {
                const phone = document.getElementById('phone').value.trim();
                if (!phone) {
                    document.getElementById('msg').innerHTML = '<i class="fas fa-exclamation-circle"></i> Informe o telefone de verificação';
                    document.getElementById('msg').className = 'error';
                    return;
                }
            }

            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Autenticando...';
            btn.disabled = true;

            const msg = document.getElementById('msg');
            msg.className = '';
            msg.style.display = 'none';

            try {
                const body = type === 'admin'
                    ? {
                        username: document.getElementById('user').value,
                        password: document.getElementById('pass').value,
                        phone: adminStep === 'phone' ? document.getElementById('phone').value.trim() : ''
                    }
                    : { key: document.getElementById('key').value };

                const res = await fetch('/auth/' + type + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const d = await res.json();

                if (d.phone_required) {
                    adminStep = 'phone';
                    document.getElementById('phone-group').style.display = 'block';
                    document.getElementById('phone').focus();
                    notificationSystem.info('Verificação', 'Confirme seu telefone para continuar', 3000);
                    resetBtn();
                    return;
                }

                if (d.success) {
                    notificationSystem.success('Autenticação Bem-sucedida', 'Redirecionando...', 2000);
                    btn.innerHTML = '<i class="fas fa-check"></i> Sucesso!';
                    btn.style.background = '#22c55e';
                    btn.style.color = '#fff';
                    setTimeout(() => { location.href = d.redirect; }, 500);
                } else {
                    const err = d.msg || d.error || 'Acesso Negado.';
                    notificationSystem.error('Falha na Autenticação', err, 4000);
                    msg.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + err;
                    msg.className = 'error';
                    resetBtn();
                }
            } catch (e) {
                notificationSystem.error('Erro de Conexão', 'Não foi possível conectar ao servidor.');
                msg.innerHTML = '<i class="fas fa-wifi"></i> Erro de conexão.';
                msg.className = 'error';
                resetBtn();
            }

            function resetBtn() {
                setTimeout(() => {
                    btn.innerHTML = orig;
                    btn.disabled = false;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const active = document.querySelector('.tab.active');
                        auth(active.textContent.includes('CLIENTE') ? 'client' : 'admin');
                    }
                });
            });
        });
    </script>
</body>
</html>
