<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALI MODS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background: #050508;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .bg-glow {
            position: fixed;
            width: 90vmax;
            height: 90vmax;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 40%, rgba(99,102,241,0.06) 0%, transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: rgba(99,102,241,0.03);
            top: -10%; left: -10%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 350px; height: 350px;
            background: rgba(99,102,241,0.02);
            bottom: -15%; right: -10%;
            animation-delay: -4s;
        }
        .orb-3 {
            width: 300px; height: 300px;
            background: rgba(168,85,247,0.02);
            bottom: 30%; right: 20%;
            animation-delay: -8s;
        }
        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
            100% { transform: translate(10px, -30px) scale(1.02); }
        }

        .noise-fixed {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .login-wrap {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center;
            animation: fadeIn 1s ease both;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .brand {
            margin-bottom: 40px;
            text-align: center;
        }
        .brand-line {
            width: 24px; height: 1px;
            background: rgba(255,255,255,0.15);
            margin: 0 auto 20px;
        }
        .brand h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #fff;
        }
        .brand h1 span { font-weight: 600; }
        .brand p {
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 12px;
            font-weight: 400;
        }

        .card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 20px;
            padding: 36px 32px 32px;
            width: 360px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .tabs {
            display: flex;
            gap: 24px;
            margin-bottom: 28px;
            justify-content: center;
        }
        .tab {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding-bottom: 6px;
            border-bottom: 1px solid transparent;
            user-select: none;
        }
        .tab:hover { color: rgba(255,255,255,0.5); }
        .tab.active { color: #fff; border-bottom-color: #6366f1; }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 10px;
            font-weight: 500;
            color: rgba(255,255,255,0.25);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 10px 0 8px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 300;
            transition: 0.3s;
            outline: none;
        }
        .form-group input:focus { border-bottom-color: rgba(255,255,255,0.2); }
        .form-group input::placeholder { color: rgba(255,255,255,0.08); font-weight: 300; }
        .form-group input:-webkit-autofill,
        .form-group input:-webkit-autofill:hover,
        .form-group input:-webkit-autofill:focus {
            -webkit-text-fill-color: #fff;
            -webkit-box-shadow: 0 0 0 30px #050508 inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #fff;
            color: #050508;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn:hover { background: #e8e8e8; transform: translateY(-1px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .submit-btn .spinner {
            display: none;
            width: 14px; height: 14px;
            border: 2px solid rgba(0,0,0,0.08);
            border-top-color: #050508;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #msg {
            margin-top: 14px;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            text-align: center;
            display: none;
            padding: 8px;
            border-radius: 8px;
        }
        #msg.error { display: block; background: rgba(239,68,68,0.06); color: #ef4444; }

        .footer {
            position: fixed;
            bottom: 24px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 9px;
            color: rgba(255,255,255,0.05);
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 1;
        }

        .notifications-container {
            position: fixed; top: 20px; right: 20px; width: 320px; z-index: 9999;
            display: flex; flex-direction: column; gap: 8px;
        }
        .notification {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 12px; padding: 12px 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            transform: translateX(400px); opacity: 0;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex; align-items: flex-start; gap: 10px;
        }
        .notification.show { transform: translateX(0); opacity: 1; }
        .notification.hide { transform: translateX(400px); opacity: 0; }
        .notification-icon { font-size: 15px; margin-top: 2px; flex-shrink: 0; }
        .notification.success .notification-icon { color: #22c55e; }
        .notification.danger .notification-icon { color: #ef4444; }
        .notification.info .notification-icon { color: #6366f1; }
        .notification-content { flex: 1; min-width: 0; }
        .notification-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; color: #fff; }
        .notification-message { font-size: 12px; color: rgba(255,255,255,0.4); line-height: 1.4; }
        .notification-close {
            background: transparent; border: none; color: rgba(255,255,255,0.2);
            cursor: pointer; font-size: 10px; padding: 4px; border-radius: 6px;
            flex-shrink: 0; width: 22px; height: 22px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .notification-close:hover { color: #fff; background: rgba(255,255,255,0.06); }

        .loading-overlay {
            position: fixed; inset: 0; z-index: 10000;
            background: rgba(5,5,8,0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: none;
            flex-direction: column; align-items: center; justify-content: center; gap: 24px;
        }
        .loading-overlay.show { display: flex; }
        .loading-ball {
            width: 32px; height: 32px;
            border: 2px solid rgba(255,255,255,0.04);
            border-top-color: #fff;
            border-radius: 50%;
            animation: loadSpin 0.8s linear infinite;
        }
        @keyframes loadSpin { to { transform: rotate(360deg); } }
        .loading-overlay p {
            font-size: 11px; color: rgba(255,255,255,0.2);
            letter-spacing: 3px; text-transform: uppercase; font-weight: 400;
        }

        @media (max-width: 420px) {
            .card { width: calc(100% - 32px); padding: 28px 20px; }
            .brand h1 { font-size: 22px; letter-spacing: 6px; }
            .notifications-container { width: calc(100% - 24px); right: 12px; top: 10px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="noise-fixed"></div>

    <div class="notifications-container" id="notifications-container"></div>

    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-ball"></div>
        <p>Autenticando...</p>
    </div>

    <div class="login-wrap">
        <div class="brand">
            <div class="brand-line"></div>
            <h1><span>KALI</span> MODS</h1>
            <p>Sistema de Autenticação</p>
        </div>

        <div class="card">
            <div class="tabs">
                <div class="tab active" onclick="sw('client')">Cliente</div>
                <div class="tab" onclick="sw('admin')">Admin</div>
            </div>

            <div id="client-form">
                <div class="form-group">
                    <label>Licença</label>
                    <input type="text" id="key" placeholder="HK-XXXX" autocomplete="off">
                </div>
                <button class="submit-btn" onclick="authDiscord()" id="client-btn">
                    <span>Continuar</span>
                    <div class="spinner"></div>
                </button>
                <div style="text-align:center;margin-top:16px;font-size:10px;color:rgba(255,255,255,0.15);">
                    Não tem uma licença?
                    <a href="https://discord.gg/seulink" target="_blank" style="color:#6366f1;text-decoration:none;font-weight:500;">Adquira aqui</a>
                </div>
            </div>

            <div id="admin-form" style="display:none">
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="user" placeholder="Nome de usuário" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="pass" placeholder="••••••••">
                </div>
                <div class="form-group" id="phone-group" style="display:none">
                    <label>Telefone</label>
                    <input type="tel" id="phone" placeholder="DDD + Número">
                </div>
                <button class="submit-btn" onclick="auth('admin')" id="admin-btn">
                    <span>Acessar</span>
                    <div class="spinner"></div>
                </button>
            </div>

            <div id="msg"></div>
        </div>
    </div>

    <div class="footer">KALI MODS  v2.0</div>

    <script>
        const notificationSystem = {
            container: document.getElementById('notifications-container'),
            n: 0,
            icons: {
                success: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
                danger: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
                info: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
            },
            show(type, title, message, duration = 4000) {
                this.n++;
                const id = 'n-' + this.n;
                const el = document.createElement('div');
                el.id = id;
                el.className = 'notification ' + type;
                el.innerHTML = `
                    <span class="notification-icon">${this.icons[type]}</span>
                    <div class="notification-content">
                        <div class="notification-title">${title}</div>
                        <div class="notification-message">${message}</div>
                    </div>
                    <button class="notification-close"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
                `;
                this.container.appendChild(el);
                el.querySelector('.notification-close').addEventListener('click', () => this.close(id));
                setTimeout(() => el.classList.add('show'), 10);
                if (duration > 0) setTimeout(() => this.close(id), duration);
                return id;
            },
            close(id) {
                const el = document.getElementById(id);
                if (!el) return;
                el.classList.remove('show'); el.classList.add('hide');
                setTimeout(() => el.remove(), 400);
            },
            success(t, m, d) { return this.show('success', t, m, d); },
            error(t, m, d) { return this.show('danger', t, m, d); },
            info(t, m, d) { return this.show('info', t, m, d); }
        };

        window.addEventListener('load', () => {
            setTimeout(() => notificationSystem.info('KALI MODS', 'Bem-vindo ao portal de acesso seguro'), 1000);
            const params = new URLSearchParams(window.location.search);
            const err = params.get('error');
            if (err === 'session_expired') {
                notificationSystem.error('Sessão expirada', 'Tente novamente digitando sua key.');
            } else if (err === 'already_linked') {
                notificationSystem.error('Conta já vinculada', 'Este Discord já está vinculado a outra key.');
            } else if (err === 'auth_failed' || err === 'no_code') {
                notificationSystem.error('Autenticação falhou', 'Não foi possível autenticar com o Discord.');
            } else if (err === 'server_error') {
                notificationSystem.error('Erro no servidor', 'Ocorreu um erro interno. Tente novamente.');
            }
        });

        function sw(t) {
            adminStep = 'credentials';
            document.getElementById('phone-group').style.display = 'none';
            document.getElementById('client-form').style.display = t === 'client' ? 'block' : 'none';
            document.getElementById('admin-form').style.display = t === 'admin' ? 'block' : 'none';
            document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById('msg').className = '';
            document.getElementById('msg').style.display = 'none';
        }

        let adminStep = 'credentials';

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            const span = btn.querySelector('span');
            const spinner = btn.querySelector('.spinner');
            if (loading) {
                span.style.display = 'none';
                spinner.style.display = 'block';
                btn.disabled = true;
            } else {
                span.style.display = '';
                spinner.style.display = 'none';
                btn.disabled = false;
            }
        }

        function showLoading(text = 'Autenticando...') {
            document.getElementById('loading-overlay').querySelector('p').innerText = text;
            document.getElementById('loading-overlay').classList.add('show');
        }
        function hideLoading() {
            document.getElementById('loading-overlay').classList.remove('show');
        }

        async function authDiscord() {
            const key = document.getElementById('key').value.trim();
            if (!key) {
                notificationSystem.error('Key necessária', 'Digite sua licença para continuar');
                return;
            }
            showLoading('Redirecionando para Discord...');
            setLoading('client-btn', true);
            try {
                const res = await fetch('/auth/discord/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key })
                });
                const d = await res.json();
                if (d.success && d.redirect) {
                    location.href = d.redirect;
                } else {
                    hideLoading();
                    notificationSystem.error('Falha na Autenticação', d.error || 'Erro ao autenticar');
                    setLoading('client-btn', false);
                }
            } catch (e) {
                hideLoading();
                notificationSystem.error('Erro de Conexão', 'Não foi possível conectar ao servidor.');
                setLoading('client-btn', false);
            }
        }

        function resetBtn(btn) {
            setTimeout(() => {
                btn.innerHTML = '<span>Acessar</span><div class="spinner"></div>';
                btn.disabled = false;
                btn.style.background = '';
                btn.style.color = '';
            }, 1000);
        }

        async function auth(type) {
            const btn = event.target.closest('button');
            const span = btn.querySelector('span');
            const spinner = btn.querySelector('.spinner');

            if (type === 'admin' && adminStep === 'phone') {
                const phone = document.getElementById('phone').value.trim();
                if (!phone) {
                    document.getElementById('msg').innerHTML = 'Informe o telefone de verificação';
                    document.getElementById('msg').className = 'error';
                    return;
                }
            }

            span.style.display = 'none';
            spinner.style.display = 'block';
            btn.disabled = true;

            const msg = document.getElementById('msg');
            msg.className = '';
            msg.style.display = 'none';

            try {
                const body = type === 'admin'
                    ? {
                        username: document.getElementById('user').value,
                        password: document.getElementById('pass').value,
                        phone: adminStep === 'phone' ? document.getElementById('phone').value.trim() : ''
                    }
                    : { key: document.getElementById('key').value };

                const res = await fetch('/auth/' + type + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const d = await res.json();

                if (d.phone_required) {
                    hideLoading();
                    adminStep = 'phone';
                    document.getElementById('phone-group').style.display = 'block';
                    document.getElementById('phone').focus();
                    notificationSystem.info('Verificação', 'Confirme seu telefone para continuar', 3000);
                    resetBtn(btn);
                    return;
                }

                if (d.success) {
                    showLoading(type === 'admin' ? 'Redirecionando para Discord...' : 'Autenticando...');
                    notificationSystem.success('Autenticação Bem-sucedida', 'Redirecionando...', 2000);
                    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#050508" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
                    btn.style.background = '#22c55e';
                    btn.style.color = '#050508';
                    setTimeout(() => { location.href = d.redirect; }, 500);
                } else {
                    hideLoading();
                    const err = d.msg || d.error || 'Acesso Negado.';
                    notificationSystem.error('Falha na Autenticação', err, 4000);
                    msg.innerHTML = err;
                    msg.className = 'error';
                    resetBtn(btn);
                }
            } catch (e) {
                hideLoading();
                notificationSystem.error('Erro de Conexão', 'Não foi possível conectar ao servidor.');
                msg.innerHTML = 'Erro de conexão.';
                msg.className = 'error';
                resetBtn(btn);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const active = document.querySelector('.tab.active');
                        auth(active.textContent.trim().toLowerCase() === 'cliente' ? 'client' : 'admin');
                    }
                });
            });
        });
    </script>
</body>
</html>
